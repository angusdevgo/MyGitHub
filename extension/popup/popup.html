<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MyGitHub 2FA</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #58a6ff;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #238636;
      color: #ffffff;
      margin-left: auto;
      font-weight: 600;
    }
    .badge.disconnected {
      background: #da3633;
    }
    .section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      margin: 8px 0;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      background: #238636;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    button.primary {
      background: #1f6feb;
    }
    button.primary:hover {
      background: #388bfd;
    }
    button.secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      margin-top: 6px;
    }
    button.secondary:hover {
      background: #30363d;
    }
    .hint {
      font-size: 11px;
      color: #8b949e;
      text-align: center;
      margin-top: 6px;
      line-height: 1.4;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
  <script src="../libs/qrcode.min.js"></script>
</head>
<body>
  <div class="header">
    <h2>MyGitHub 2FA</h2>
    <span id="status-badge" class="badge disconnected">未配对</span>
  </div>

  <div class="section" id="pair-section">
    <div class="section-title">手机扫码配对 (仅需一次)</div>
    <div class="qr-container">
      <div id="qrcode"></div>
    </div>
    <div class="hint">打开手机 MyGitHub → 应用设置 → 安全中心 → 跨设备 2FA 配对，扫描上方二维码</div>
    
    <div style="margin-top: 10px;">
      <button id="paired-confirm-btn" class="primary">手机已扫码？点击确认已配对</button>
      <button id="test-call-btn" class="secondary" style="margin-top: 6px;">🚀 测试向手机发送验证弹窗</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">连接与网络选项</div>
    <div class="field">
      <label>手机局域网 IP (同一 Wi-Fi 可免中继直连)</label>
      <input type="text" id="phone-ip-input" placeholder="例如: 192.168.1.100" />
    </div>
    <div class="field">
      <label>GitHub 用户名</label>
      <input type="text" id="account-input" placeholder="angusdevgo" />
    </div>
    <div class="field">
      <label>Cloudflare Relay 地址 (跨外网使用)</label>
      <input type="text" id="relay-input" placeholder="https://mygithub-relay.workers.dev" />
    </div>
    <button id="save-btn" class="secondary">保存网络设置</button>
    <button id="reset-btn" class="secondary">重置并重新生成密钥</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
